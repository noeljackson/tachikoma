[package]
name = "approval-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/noeljackson/tachikoma"
description = "Optional authenticated client for the Tachikoma approval API"

[dependencies]
approval-protocol = { path = "../approval-protocol", version = "0.1.0" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"

[package.metadata.tachikoma]
boundary = "client"
