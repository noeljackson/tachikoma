[package]
name = "control-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
approval-protocol = { path = "../approval-protocol", version = "0.1.0" }
anyhow = "1"
axum = "0.8"
getrandom = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.tachikoma]
boundary = "control"
