[package]
name = "tachikoma-assessment-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
approval-protocol = { path = "../../crates/approval-protocol" }
approval-client = { path = "../../crates/approval-client" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.tachikoma]
boundary = "worker"
