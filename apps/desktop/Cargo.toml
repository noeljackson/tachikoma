[package]
name = "approval-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[[bin]]
name = "tachikoma-gui"
path = "src/main.rs"

[dependencies]
approval-client = { path = "../../crates/approval-client" }
approval-protocol = { path = "../../crates/approval-protocol" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
gpui = { package = "gpui-ce", git = "https://github.com/noeljackson/gpui-ce", rev = "26813dad6cbc4a5e1a2f56ef46e27d0f16ea30ff", default-features = false }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/noeljackson/gpui-ce", rev = "26813dad6cbc4a5e1a2f56ef46e27d0f16ea30ff", features = ["wayland", "x11"] }
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/noeljackson/gpui-ce", rev = "26813dad6cbc4a5e1a2f56ef46e27d0f16ea30ff" }
serde_json = "1"
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[package.metadata.tachikoma]
boundary = "app"
