[package]
name = "approval-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[[bin]]
name = "tachikoma-gui"
path = "src/main.rs"

[dependencies]
approval-client = { path = "../../crates/approval-client" }
approval-protocol = { path = "../../crates/approval-protocol" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "94791b8882f88c126b3089759cb7829a9c1de1a2", default-features = false, features = ["wayland", "x11"] }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "94791b8882f88c126b3089759cb7829a9c1de1a2", features = ["wayland", "x11"] }
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/gpui-ce/gpui-ce", rev = "94791b8882f88c126b3089759cb7829a9c1de1a2" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[package.metadata.tachikoma]
boundary = "app"

[dev-dependencies]
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "94791b8882f88c126b3089759cb7829a9c1de1a2", default-features = false, features = ["test-support"] }
gpui_wgpu = { package = "gpui_ce_wgpu", git = "https://github.com/gpui-ce/gpui-ce", rev = "94791b8882f88c126b3089759cb7829a9c1de1a2", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
