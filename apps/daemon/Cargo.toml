[package]
name = "approval-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[[bin]]
name = "tachikomad"
path = "src/main.rs"

[dependencies]
control-plane = { path = "../../crates/control-plane" }
approval-web = { path = "../web" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[package.metadata.tachikoma]
boundary = "control"
