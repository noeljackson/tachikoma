[package]
name = "approval-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
approval-protocol = { path = "../../crates/approval-protocol" }
approval-client = { path = "../../crates/approval-client" }
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }

[package.metadata.tachikoma]
boundary = "app"
