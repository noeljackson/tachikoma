[package]
name = "tachikoma"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first policy proposal control plane"
repository = "https://github.com/noeljackson/tachikoma"

[lib]
name = "tachikoma"
path = "src/lib.rs"

[[bin]]
name = "tachikomad"
path = "src/main.rs"

[[bin]]
name = "tachikoma"
path = "src/cli.rs"

[dependencies]
anyhow = "1.0.100"
askama = "0.16.0"
axum = "0.8.8"
buffa = "0.8.1"
clap = { version = "4.5.60", features = ["derive"] }
connectrpc = { version = "0.8.1", features = ["axum", "client", "server"] }
crossterm = "0.29.0"
dirs = "6.0.0"
getrandom = "0.4.3"
http = "1.4.0"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
connectrpc-build = "0.8.0"
