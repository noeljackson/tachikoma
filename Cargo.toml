[workspace]
resolver = "3"
members = [".", "services/snitchgate", "crates/approval-protocol", "crates/approval-client", "crates/control-plane", "apps/tui", "workers/assessment", "workers/review-slack", "services/kubernetesgate", "apps/web", "apps/daemon", "services/evidence-source", "apps/desktop"]
default-members = ["."]

[package]
name = "tachikoma"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Local-first policy proposal control plane"
repository = "https://github.com/noeljackson/tachikoma"

[lib]
name = "tachikoma"
path = "src/lib.rs"
# connectrpc's generated server-streaming RPIT trait currently makes rustdoc's
# merged doctest harness exit without diagnostics. This crate has no doctests;
# executable examples are covered by unit/integration and CLI smoke tests.
doctest = false

[[bin]]
name = "tachikoma-legacyd"
path = "src/main.rs"

[[bin]]
name = "tachikoma"
path = "src/cli.rs"

[dependencies]
approval-protocol = { path = "crates/approval-protocol" }
approval-client = { path = "crates/approval-client" }
approval-tui = { path = "apps/tui" }
anyhow = "1.0.100"
# The dashboard uses default template paths, so avoid the optional config
# parser and its unmaintained basic-toml dependency.
askama = { version = "0.16.0", default-features = false, features = ["derive", "std", "urlencode"] }
async-trait = "0.1.92"
axum = "0.8.8"
buffa = "0.8.1"
clap = { version = "4.5.60", features = ["derive"] }
connectrpc = { version = "0.8.2", features = ["axum", "client", "server"] }
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = "0.3.33"
getrandom = "0.4.3"
http = "1.4.0"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2.178"
pi-agent = { git = "https://github.com/noeljackson/pi", tag = "v0.2.1" }
pi-ai = { git = "https://github.com/noeljackson/pi", tag = "v0.2.1", default-features = false, features = ["rustls-tls"] }
pi-providers = { git = "https://github.com/noeljackson/pi", tag = "v0.2.1", default-features = false, features = ["rustls-tls"] }
pi-session = { git = "https://github.com/noeljackson/pi", tag = "v0.2.1" }
pi-tui = { git = "https://github.com/noeljackson/pi", tag = "v0.2.1" }
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
connectrpc-build = "0.8.0"

[profile.release]
lto = "thin"
strip = true

[package.metadata.tachikoma]
boundary = "control"
