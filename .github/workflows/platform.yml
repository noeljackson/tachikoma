name: approval-platform
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Runtime, public API, and failure contracts (Rust 1.96)
        run: make test-docker
      - name: Build an independent producer
        run: docker build --target service-runtime --build-arg SERVICE=kubernetesgate --build-arg BINARY=kubernetesgate --tag kubernetesgate:contract .
