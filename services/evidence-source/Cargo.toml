[package]
name = "tachikoma-source"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
approval-protocol = { path = "../../crates/approval-protocol" }
approval-client = { path = "../../crates/approval-client" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

[package.metadata.tachikoma]
boundary = "domain:evidence-source"
