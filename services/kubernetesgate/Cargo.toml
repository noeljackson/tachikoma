[package]
name = "kubernetesgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
approval-protocol = { path = "../../crates/approval-protocol" }
approval-client = { path = "../../crates/approval-client" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[package.metadata.tachikoma]
boundary = "domain:kubernetesgate"
